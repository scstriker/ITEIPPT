<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" font-family="Arial, SimHei, sans-serif">
  <defs>
    <marker id="df-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f3f70"/>
    </marker>
    <marker id="df-arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="#ffffff"/>
  <!-- browser -->
  <rect x="20" y="30" width="520" height="440" fill="#f3f5f8" stroke="#0f3f70" stroke-width="3"/>
  <rect x="20" y="30" width="520" height="64" fill="#0f3f70"/>
  <text x="280" y="72" font-size="30" fill="#ffffff" text-anchor="middle">浏览器（用户电脑）</text>
  <g font-size="26" fill="#1f2a37">
    <text x="50" y="140">· 解析 PDF / DOCX，提取文本</text>
    <text x="50" y="190">· 保存流程状态、已导入图片</text>
    <text x="50" y="240">· 按所内模板渲染 PPTX</text>
    <text x="50" y="290">· 下载 ITEIPPT_v2_output.pptx</text>
    <text x="50" y="360" fill="#5b6675">原文件和图片不离开浏览器</text>
    <text x="50" y="400" fill="#5b6675">刷新页面后以上数据清空</text>
  </g>
  <!-- backend -->
  <rect x="680" y="30" width="420" height="440" fill="#f3f5f8" stroke="#0f3f70" stroke-width="3"/>
  <rect x="680" y="30" width="420" height="64" fill="#0f3f70"/>
  <text x="890" y="72" font-size="30" fill="#ffffff" text-anchor="middle">ITEISlides 后端</text>
  <g font-size="26" fill="#1f2a37">
    <text x="710" y="140">· /api/plan 规划框架</text>
    <text x="710" y="190">· 生成任务（排队、执行）</text>
    <text x="710" y="240">· 保存任务 72 小时</text>
    <text x="710" y="290">· 持有 Gemini 密钥</text>
  </g>
  <!-- gemini -->
  <rect x="1240" y="150" width="340" height="200" fill="#ffffff" stroke="#5b6675" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="1410" y="240" font-size="30" fill="#1f2a37" text-anchor="middle">Gemini</text>
  <text x="1410" y="285" font-size="24" fill="#5b6675" text-anchor="middle">Google 提供的大模型</text>
  <!-- arrows browser <-> backend -->
  <line x1="545" y1="160" x2="672" y2="160" stroke="#0f3f70" stroke-width="5" marker-end="url(#df-arrow)"/>
  <text x="608" y="140" font-size="22" fill="#0f3f70" text-anchor="middle">文档全文</text>
  <text x="608" y="190" font-size="22" fill="#0f3f70" text-anchor="middle">+ 框架</text>
  <line x1="675" y1="300" x2="548" y2="300" stroke="#0f3f70" stroke-width="5" marker-end="url(#df-arrow)"/>
  <text x="608" y="280" font-size="22" fill="#0f3f70" text-anchor="middle">建议、</text>
  <text x="608" y="330" font-size="22" fill="#0f3f70" text-anchor="middle">逐页内容</text>
  <!-- backend <-> gemini -->
  <line x1="1105" y1="210" x2="1232" y2="210" stroke="#5b6675" stroke-width="5" marker-end="url(#df-arrow-g)"/>
  <text x="1170" y="190" font-size="22" fill="#5b6675" text-anchor="middle">提示词</text>
  <line x1="1235" y1="290" x2="1108" y2="290" stroke="#5b6675" stroke-width="5" marker-end="url(#df-arrow-g)"/>
  <text x="1170" y="330" font-size="22" fill="#5b6675" text-anchor="middle">JSON</text>
  <text x="800" y="505" font-size="22" fill="#5b6675" text-anchor="middle">实线：本单位部署的服务；虚线：外部服务（数据出境）</text>
</svg>
