<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" font-family="Arial, SimHei, sans-serif">
  <defs>
    <marker id="jb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f3f70"/>
    </marker>
  </defs>
  <rect width="1600" height="420" fill="#ffffff"/>
  <g font-size="30" text-anchor="middle">
    <rect x="20" y="150" width="260" height="90" fill="#ffffff" stroke="#0f3f70" stroke-width="3"/>
    <text x="150" y="205" fill="#0f3f70">创建任务</text>
    <rect x="380" y="150" width="260" height="90" fill="#f3f5f8" stroke="#0f3f70" stroke-width="3"/>
    <text x="510" y="190" fill="#0f3f70">排队中</text>
    <text x="510" y="225" font-size="22" fill="#5b6675">queued</text>
    <rect x="740" y="150" width="300" height="90" fill="#f3f5f8" stroke="#0f3f70" stroke-width="3"/>
    <text x="890" y="190" fill="#0f3f70">运行中</text>
    <text x="890" y="225" font-size="22" fill="#5b6675">running · 按批次推进</text>
    <rect x="1160" y="40" width="420" height="90" fill="#0f3f70"/>
    <text x="1370" y="80" fill="#ffffff">已完成</text>
    <text x="1370" y="115" font-size="22" fill="#ffffff">succeeded · 可取结果</text>
    <rect x="1160" y="260" width="420" height="90" fill="#ffffff" stroke="#0f3f70" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="1370" y="300" fill="#0f3f70">执行失败</text>
    <text x="1370" y="335" font-size="22" fill="#5b6675">failed · 显示原因，可重新生成</text>
  </g>
  <line x1="282" y1="195" x2="372" y2="195" stroke="#0f3f70" stroke-width="5" marker-end="url(#jb-arrow)"/>
  <line x1="642" y1="195" x2="732" y2="195" stroke="#0f3f70" stroke-width="5" marker-end="url(#jb-arrow)"/>
  <line x1="1042" y1="180" x2="1152" y2="95" stroke="#0f3f70" stroke-width="5" marker-end="url(#jb-arrow)"/>
  <line x1="1042" y1="210" x2="1152" y2="295" stroke="#0f3f70" stroke-width="5" marker-end="url(#jb-arrow)"/>
  <g font-size="22" fill="#5b6675">
    <text x="20" y="300">浏览器每 2 秒查询一次进度；</text>
    <text x="20" y="335">等待超过 20 分钟按失败处理。</text>
    <text x="740" y="300">部分批次失败时仍会完成，</text>
    <text x="740" y="335">结果标为“降级”。</text>
  </g>
  <g font-size="22" fill="#ffffff" text-anchor="middle">
    <circle cx="20" cy="150" r="18" fill="#c8102e"/><text x="20" y="158">1</text>
    <circle cx="380" cy="150" r="18" fill="#c8102e"/><text x="380" y="158">2</text>
    <circle cx="740" cy="150" r="18" fill="#c8102e"/><text x="740" y="158">3</text>
  </g>
</svg>
