<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITEIPPT生成工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #f8fafb;
  --bg-card: #ffffff;
  --bg-sidebar: #0E2841;
  --border: #e2e8f0;
  --border-focus: #0A406C;
  --text: #1e293b;
  --text-dim: #475569;
  --text-muted: #94a3b8;
  --primary: #0A406C;
  --primary-light: #0088D0;
  --accent: #156082;
  --brand-red: #BA1F25;
  --deep-navy: #004070;
  --success: #059669;
  --warning: #d97706;
  --error: #dc2626;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }

/* ============ Header ============ */
.header {
  background: var(--bg-sidebar);
  padding: 16px 32px;
  display: flex; align-items: center; justify-content: space-between;
  color: white;
}
.header-logo {
  width: 36px; height: 36px;
  background: white;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 11px; color: var(--primary);
}
.header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.02em; }

/* ============ Stepper ============ */
.stepper {
  display: flex; justify-content: center; gap: 0;
  padding: 20px 32px;
  background: white;
  border-bottom: 1px solid var(--border);
}
.step-tab {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 24px;
  font-size: 14px; font-weight: 500;
  color: var(--text-muted);
  cursor: default;
  position: relative;
}
.step-tab::after {
  content: '→'; margin-left: 14px; font-size: 13px; opacity: 0.3;
}
.step-tab:last-child::after { display: none; }
.step-num {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  background: var(--border); color: var(--text-muted);
  transition: all 0.3s;
}
.step-tab.active .step-num { background: var(--primary); color: white; }
.step-tab.done .step-num { background: var(--success); color: white; }
.step-tab.active { color: var(--primary); }
.step-tab.done { color: var(--success); }

/* ============ Main Container ============ */
.container { max-width: 1140px; margin: 0 auto; padding: 24px 32px; }

/* ============ Panels ============ */
.panel { display: none; }
.panel.active { display: block; }

/* ============ Cards ============ */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  font-size: 15px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
}
.card-body { padding: 20px; }

/* ============ Forms ============ */
label { display: block; font-size: 13px; font-weight: 500; color: var(--text-dim); margin-bottom: 5px; }
input[type="text"], input[type="password"], input[type="number"], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px; color: var(--text);
  font-family: var(--sans); font-size: 14px; outline: none;
  transition: border-color 0.2s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px rgba(10,64,108,0.08);
}
textarea { resize: vertical; min-height: 72px; font-size: 13px; }
.form-group { margin-bottom: 14px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.hint { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

/* ============ Upload ============ */
.upload-zone {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 48px 24px; text-align: center;
  cursor: pointer; transition: all 0.2s; background: var(--bg);
}
.upload-zone:hover { border-color: var(--primary-light); background: rgba(0,136,208,0.03); }
.upload-zone.has-file { border-color: var(--success); border-style: solid; background: rgba(5,150,105,0.03); }
.upload-icon { font-size: 40px; margin-bottom: 8px; opacity: 0.5; }
.upload-text { font-size: 14px; color: var(--text-dim); }
.upload-text strong { color: var(--text); }
.file-info {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--bg);
  border-radius: 8px; margin-top: 12px; font-size: 13px;
}
.file-info .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-info .size { color: var(--text-muted); flex-shrink: 0; }
.file-info .remove { color: var(--error); cursor: pointer; padding: 0 4px; }

/* ============ Summary Card ============ */
.summary-card {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  margin-top: 16px;
}
.summary-item {
  padding: 12px 16px; background: var(--bg); border-radius: 8px;
}
.summary-item .label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.summary-item .value { font-size: 14px; margin-top: 4px; font-weight: 500; }

/* ============ Framework Table ============ */
.fw-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.fw-table th {
  background: var(--primary); color: white;
  padding: 10px 12px; text-align: left; font-weight: 500;
}
.fw-table td {
  padding: 8px 12px; border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.fw-table tr:hover td { background: rgba(0,136,208,0.03); }
.fw-table input, .fw-table select {
  padding: 5px 8px; font-size: 13px; border-radius: 6px;
}
.fw-table input[type="number"] { width: 60px; text-align: center; }
.fw-table input[type="text"] { width: 100%; }
.fw-total {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--bg); border-radius: 8px;
  margin-top: 12px; font-size: 14px; font-weight: 500;
}
.fw-total .count { font-size: 24px; font-weight: 700; color: var(--primary); }
.btn-add-row {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 14px; font-size: 12px; font-weight: 500;
  color: var(--primary); background: rgba(10,64,108,0.06);
  border: 1px solid rgba(10,64,108,0.15); border-radius: 6px;
  cursor: pointer; margin-top: 8px;
}
.btn-add-row:hover { background: rgba(10,64,108,0.1); }
.btn-del { color: var(--error); cursor: pointer; font-size: 16px; border: none; background: none; padding: 2px 6px; }
.btn-del:hover { background: rgba(220,38,38,0.08); border-radius: 4px; }

/* ============ AI Suggestion ============ */
.ai-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; font-size: 11px; font-weight: 500;
  background: rgba(217,119,6,0.1); color: var(--warning);
  border-radius: 4px;
}

/* ============ Audit Slide Cards ============ */
.audit-grid { display: flex; flex-direction: column; gap: 10px; }
.audit-card {
  display: grid; grid-template-columns: 6px 48px 1fr auto;
  align-items: stretch; gap: 0;
  border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden; background: white; transition: box-shadow 0.2s;
}
.audit-card:hover { box-shadow: var(--shadow-lg); }
.audit-bar { /* coverage color bar */ }
.audit-bar.high { background: var(--success); }
.audit-bar.medium { background: var(--warning); }
.audit-bar.low { background: var(--error); }
.audit-num {
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: var(--text-muted);
  background: var(--bg); border-right: 1px solid var(--border);
}
.audit-body { padding: 12px 16px; }
.audit-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.audit-section { font-size: 11px; color: var(--primary-light); font-weight: 500; margin-bottom: 6px; }
.audit-bullets { font-size: 12px; color: var(--text-dim); line-height: 1.7; }
.audit-bullets li { margin-bottom: 2px; }
.audit-source { font-size: 11px; color: var(--text-muted); margin-top: 6px; font-style: italic; }
.audit-meta {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 12px 16px; gap: 6px; min-width: 100px; border-left: 1px solid var(--border);
}
.audit-layout-tag {
  font-size: 10px; font-weight: 600; padding: 3px 8px;
  background: rgba(10,64,108,0.06); color: var(--primary);
  border-radius: 4px; text-transform: uppercase;
}
.audit-coverage {
  font-size: 11px; font-weight: 500;
  display: flex; align-items: center; gap: 4px;
}
.audit-coverage.high { color: var(--success); }
.audit-coverage.medium { color: var(--warning); }
.audit-coverage.low { color: var(--error); }
.audit-warn {
  font-size: 11px; color: var(--warning);
  background: rgba(217,119,6,0.06);
  padding: 4px 8px; border-radius: 4px;
  margin-top: 4px; text-align: center;
}

/* ============ Buttons ============ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 20px; border-radius: 8px;
  font-family: var(--sans); font-size: 14px; font-weight: 600;
  cursor: pointer; border: none; transition: all 0.2s;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--deep-navy); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(10,64,108,0.25); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-secondary { background: var(--bg); color: var(--text-dim); border: 1px solid var(--border); }
.btn-secondary:hover { background: white; border-color: var(--text-muted); }
.btn-success { background: var(--success); color: white; }
.btn-success:hover { background: #047857; }
.btn-ai { background: linear-gradient(135deg, var(--primary-light), var(--accent)); color: white; }
.btn-ai:hover { box-shadow: 0 4px 16px rgba(0,136,208,0.3); }
.btn-ai:disabled { opacity: 0.5; cursor: not-allowed; }

.actions { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; }
.actions-right { display: flex; gap: 10px; }

/* ============ Log Panel ============ */
.log-panel {
  background: #1a1e2e; border-radius: 8px;
  padding: 14px; max-height: 200px; overflow-y: auto;
  font-family: var(--mono); font-size: 12px; line-height: 1.8;
  color: #94a3b8; margin-top: 16px;
}
.log-panel .log-success { color: #34d399; }
.log-panel .log-error { color: #f87171; }
.log-panel .log-warn { color: #fbbf24; }

/* ============ Result ============ */
.result-box { text-align: center; padding: 40px 20px; }
.result-icon { font-size: 56px; margin-bottom: 16px; }
.result-title { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
.result-desc { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
.btn-download {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 32px; background: var(--success); color: white;
  border: none; border-radius: 10px; font-family: var(--sans);
  font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.btn-download:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(5,150,105,0.3); }

/* ============ Spinner ============ */
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ Two-col layout for panels ============ */
.panel-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
.panel-full { grid-column: 1 / -1; }
@media (max-width: 860px) { .panel-grid { grid-template-columns: 1fr; } }

/* ============ Modal ============ */
.modal {
  display: none; position: fixed; z-index: 1000; left: 0; top: 0;
  width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5);
  align-items: center; justify-content: center;
}
.modal.show { display: flex; }
.modal-content {
  background-color: white; border-radius: 12px; padding: 24px;
  width: 90%; max-width: 400px; box-shadow: var(--shadow-xl);
  position: relative;
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-header h2 { font-size: 18px; margin: 0; }
.close-btn { color: var(--text-muted); font-size: 24px; font-weight: bold; cursor: pointer; }
.close-btn:hover { color: var(--text); }
</style>
</head>
<body>

<!-- ===== Header ===== -->
<div class="header">
  <div style="display:flex; align-items:center; gap:16px;">
    <div class="header-logo">ITEI</div>
    <div>
      <h1 style="margin:0;">ITEIPPT生成工具</h1>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-secondary" onclick="openSettings()" style="padding: 8px; border-radius: 50%;" title="API配置">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </div>
</div>

<!-- ===== Settings Modal ===== -->
<div id="settingsModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>⚙️ API 配置</h2>
      <span class="close-btn" onclick="closeSettings()">&times;</span>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="AIza..." />
        <div class="hint">仅在浏览器端使用</div>
      </div>
      <div class="form-group">
        <label>模型</label>
        <select id="modelSelect">
          <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
        </select>
      </div>
      <div class="form-group">
        <label>API 端点（可选）</label>
        <input type="text" id="apiEndpoint" placeholder="generativelanguage.googleapis.com" />
        <div class="hint">留空用官方端点；可填代理</div>
      </div>
    </div>
  </div>
</div>

<!-- ===== Stepper ===== -->
<div class="stepper" id="stepper">
  <div class="step-tab active" data-step="0"><span class="step-num">1</span> 上传文档</div>
  <div class="step-tab" data-step="1"><span class="step-num">2</span> 规划框架</div>
  <div class="step-tab" data-step="2"><span class="step-num">3</span> 审计预览</div>
  <div class="step-tab" data-step="3"><span class="step-num">4</span> 生成下载</div>
</div>

<!-- ===== Main ===== -->
<div class="container">

<!-- ==================== STEP 0: Upload ==================== -->
<div class="panel active" id="panel-0">
  <div class="panel-grid">
    <div>
      <!-- Basic Settings -->
      <div class="card">
        <div class="card-header">🔢 基本设置</div>
        <div class="card-body">
          <div class="form-group">
            <label>目标页数</label>
            <input type="number" id="targetSlides" value="20" min="5" max="50" />
          </div>
          <div class="form-group">
            <label>汇报人</label>
            <input type="text" id="presenterName" placeholder="（可选）" />
          </div>
          <div class="form-group">
            <label>所属机构</label>
            <input type="text" id="institution" value="机械工业仪器仪表综合技术经济研究所" />
          </div>
        </div>
      </div>
      <!-- Log -->
      <div class="log-panel" id="logPanel" style="margin-top: 24px;"></div>
    </div>
    <div>
      <!-- Upload -->
      <div class="card">
        <div class="card-header">📄 上传文档</div>
        <div class="card-body">
          <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">📂</div>
            <div class="upload-text"><strong>点击选择</strong> 或拖拽文件至此</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:6px;">支持 .pdf / .docx</div>
          </div>
          <input type="file" id="fileInput" accept=".pdf,.docx" style="display:none" />
          <div id="fileInfo" style="display:none" class="file-info">
            <span>📎</span>
            <span class="name" id="fileName"></span>
            <span class="size" id="fileSize"></span>
            <span class="remove" id="fileRemove" title="移除">✕</span>
          </div>
          <div style="display:flex; justify-content:flex-end; margin-top:16px;">
            <button class="btn btn-primary" id="btnStep0Next" disabled>提取并分析 →</button>
          </div>
          <!-- Summary will appear here after extraction -->
          <div id="summaryBox" style="display:none; margin-top:16px;">
            <div style="font-size:13px;font-weight:600;color:var(--primary);margin-bottom:8px;">文档摘要</div>
            <div class="summary-card" id="summaryCard"></div>
            <!-- Mode choice -->
            <div id="modeChoice" style="display:none; margin-top:20px; padding:16px; border-radius:10px; background:var(--card-bg); border:1px solid var(--border);">
              <div style="font-size:14px;font-weight:600;margin-bottom:12px;">选择生成模式</div>
              <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <button class="btn btn-primary" id="btnModeAI" style="flex:1;min-width:200px;padding:14px 16px;text-align:left;line-height:1.5;">
                  <strong>AI 深度审计模式</strong><br>
                  <span style="font-size:11px;opacity:0.85;">自定义框架 → AI 逐页填充内容 → 预览审计 → 生成</span>
                </button>
                <button class="btn btn-secondary" id="btnModeDirect" style="flex:1;min-width:200px;padding:14px 16px;text-align:left;line-height:1.5;border:2px solid var(--primary);">
                  <strong>快速直出模式</strong><br>
                  <span style="font-size:11px;opacity:0.85;">自动解析文档结构 → 一键直出 PPT（无需 AI 审计）</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ==================== STEP 1: Framework Planning ==================== -->
<div class="panel" id="panel-1">
  <div class="card">
    <div class="card-header" style="justify-content:space-between;">
      📐 演讲框架规划
      <button class="btn btn-ai" id="btnAiSuggest" style="padding:6px 14px;font-size:12px;">✨ AI 建议调整</button>
    </div>
    <div class="card-body">
      <div id="aiSuggestionBox" style="display:none; margin-bottom:16px; padding:12px 16px; background:rgba(217,119,6,0.05); border:1px solid rgba(217,119,6,0.2); border-radius:8px;">
        <div style="font-size:13px;font-weight:600;color:var(--warning);margin-bottom:6px;">✨ AI 调整建议</div>
        <div id="aiSuggestionText" style="font-size:13px;line-height:1.7;color:var(--text-dim);"></div>
      </div>
      <table class="fw-table" id="fwTable">
        <thead>
          <tr>
            <th style="width:40px">#</th>
            <th style="width:180px">章节名称</th>
            <th style="width:60px">张数</th>
            <th>内容要点</th>
            <th style="width:120px">布局提示</th>
            <th style="width:40px"></th>
          </tr>
        </thead>
        <tbody id="fwBody"></tbody>
      </table>
      <div style="display:flex;align-items:center;gap:12px;margin-top:12px;">
        <button class="btn-add-row" id="btnAddRow">＋ 添加章节</button>
        <button class="btn-add-row" id="btnResetFw" style="color:var(--text-muted);">↺ 重置默认</button>
      </div>

// ============================================================
// LOGGING
// ============================================================
const logPanel = document.getElementById('logPanel');
function log(msg, type = 'info') {
  const line = document.createElement('div');
  line.className = type !== 'info' ? `log-${type}` : '';
  const ts = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  line.textContent = `[${ts}] ${msg}`;
  logPanel.appendChild(line);
  logPanel.scrollTop = logPanel.scrollHeight;
}

// ============================================================
// NAVIGATION
// ============================================================
function goToStep(step) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${step}`).classList.add('active');
  document.querySelectorAll('.step-tab').forEach(t => {
    const s = parseInt(t.dataset.step);
    t.className = 'step-tab' + (s < step ? ' done' : s === step ? ' active' : '');
  });
  currentStep = step;
}

// ============================================================
// UPLOAD
// ============================================================
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); });
uploadZone.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });
document.getElementById('fileRemove').addEventListener('click', clearFile);

function handleFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}
function updateStep0Btn() {
  document.getElementById('btnStep0Next').disabled = !(document.getElementById('apiKey').value.trim() && uploadedFile);
}

// ============================================================
// TEXT EXTRACTION
// ============================================================
async function extractText(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const ab = await file.arrayBuffer();
  if (ext === 'pdf') {
    log('使用 PDF.js 提取文本...');
    const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += `\n--- 第 ${i} 页 ---\n` + content.items.map(it => it.str).join(' ');
    }
    log(`PDF 提取完成: ${pdf.numPages} 页, ${text.length} 字符`, 'success');
    return text;
  }
  if (ext === 'docx') {
    log('使用 mammoth.js 提取文本...');
    const result = await mammoth.extractRawText({ arrayBuffer: ab });
    log(`Word 提取完成: ${result.value.length} 字符`, 'success');
    return result.value;
  }
  throw new Error('不支持的文件格式');
}

// ============================================================
// GEMINI API HELPER
// ============================================================
async function callGemini(prompt, jsonMode = true) {
  const apiKey = document.getElementById('apiKey').value.trim();
  const model = document.getElementById('modelSelect').value;
  let endpoint = document.getElementById('apiEndpoint').value.trim();
  if (!endpoint) endpoint = 'generativelanguage.googleapis.com';
  endpoint = endpoint.replace(/^https?:\/\//, '');

  const url = `https://${endpoint}/v1beta/models/${model}:generateContent?key=${apiKey}`;
  const body = {
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: {
      temperature: 0.3,
      maxOutputTokens: 16384,
    }
  };
  if (jsonMode) body.generationConfig.responseMimeType = 'application/json';

  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  if (!resp.ok) {
    const err = await resp.text();
    throw new Error(`API ${resp.status} (${endpoint}): ${err.slice(0, 300)}`);
  }
  const data = await resp.json();
  if (data.error) throw new Error(`API: ${data.error.message}`);
  const raw = data.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!raw) throw new Error('API 返回空内容');
  let cleaned = raw.trim();
  if (cleaned.startsWith('```')) {
    cleaned = cleaned.replace(/^```(?:json)?\s*/, '').replace(/\s*```$/, '');
  }
  
  if (!jsonMode) return cleaned;
  
  try {
    return JSON.parse(cleaned);
  } catch (e) {
    console.warn('JSON 解析初次失败，尝试自动修复非法的转义字符...', e);
    try {
      // 修复非法转义：JSON 字符串中反斜杠必须用于转义特定字符（" \ / b f n r t u），
      // 否则必须写作 \\。此正则匹配非合法序列的反斜杠并转义之。
      let fixed = cleaned.replace(/\\([^"\\\/bfnrtu])/g, '\\\\$1');
      return JSON.parse(fixed);
    } catch (e2) {
      log('JSON 结构损坏严重，无法解析。', 'error');
      throw new Error(`Bad JSON at pos: ${e2.message}`);
    }
  }
}

// ============================================================
// DIRECT MODE: Parse document structure from plain text
// ============================================================
function parseDocStructure(text) {
  if (!text) return [];
  const lines = text.split(/\n/);
  const sections = []; // [{level, title, lines:[]}]
  
  // Heading detection patterns
  const patterns = [
    // 第一章 / 第二章 ... (level 1)
    { rx: /^第[一二三四五六七八九十百千]+章[\s：:]+(.+)/, level: 1 },
    // 摘要/引言/结论/参考文献 etc. (level 1)
    { rx: /^(摘\s*要|引\s*言|结\s*论|总\s*结|致\s*谢|参考文献|附\s*录|前\s*言|绪\s*论)(.*)/, level: 1, useFullMatch: true },
    // N.M 标题 (like 2.1, 3.2) (level 2)
    { rx: /^(\d+\.\d+)\s+(.+)/, level: 2 },
    // N 标题 (bare chapter number, like "1 引言") (level 1)
    { rx: /^(\d+)\s+([^\d].{2,})/, level: 1 },
    // 一、/ 二、 etc (level 1)
    { rx: /^[一二三四五六七八九十]+[、．.]\s*(.+)/, level: 1 },
    // (一) / (二) etc (level 2)
    { rx: /^[（(][一二三四五六七八九十]+[)）]\s*(.+)/, level: 2 },
  ];

  let currentSection = null;

  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;

    let matched = false;
    for (const pat of patterns) {
      const m = trimmed.match(pat.rx);
      if (m) {
        const title = pat.useFullMatch ? trimmed : (m[2] || m[1] || trimmed);
        currentSection = { level: pat.level, title: title.trim(), lines: [] };
        sections.push(currentSection);
        matched = true;
        break;
      }
    }

    if (!matched && currentSection) {
      currentSection.lines.push(trimmed);
    } else if (!matched && sections.length === 0) {
      // Pre-heading content (might be title/abstract)
      // Check if it looks like a document title (short, no punctuation at end)
      if (trimmed.length < 60 && !trimmed.endsWith('。') && !trimmed.endsWith('.')) {
        // Could be title - skip for now, docSummary has it
      }
    }
  }

  return sections;
}

// ============================================================
// DIRECT MODE: Build slides from parsed structure
// ============================================================
function buildDirectSlides(sections, summary, fullText) {
  const slides = [];
  const institution = document.getElementById('institution').value || '机械工业仪器仪表综合技术经济研究所';
  let slideIdx = 0;

  // 1. Cover slide
  slideIdx++;
  slides.push({
    section_name: '封面',
    slide_index: slideIdx,
    layout: 'title',
    title: institution,
    subtitle: summary?.title || '科研汇报',
    coverage: 'high'
  });

  // Collect top-level sections for TOC
  const topSections = sections.filter(s => s.level === 1);
  
  // 2. TOC slide (if enough sections)
  if (topSections.length >= 2) {
    slideIdx++;
    slides.push({
      section_name: '目录',
      slide_index: slideIdx,
      layout: 'toc',
      title: '目 录',
      content: topSections.slice(0, 8).map(s => s.title),
      coverage: 'high'
    });
  }

  // 3. Content slides for each section
  const MAX_CHARS_PER_SLIDE = 500; // Max chars per slide content
  
  for (let i = 0; i < sections.length; i++) {
    const sec = sections[i];
    const secText = sec.lines.join('\n');
    
    // Find sub-sections belonging to this section
    const subSections = [];
    if (sec.level === 1) {
      for (let j = i + 1; j < sections.length; j++) {
        if (sections[j].level <= sec.level) break;
        subSections.push(sections[j]);
      }
    }

    // Determine section name for grouping
    const sectionName = sec.level === 1 ? sec.title : 
      (sections.slice(0, i).reverse().find(s => s.level === 1)?.title || sec.title);

    if (sec.level === 1 && subSections.length > 0) {
      // Parent section with children: create one slide per child
      // But first, if parent has its own content, create a slide for it
      if (secText.length > 30) {
        slideIdx++;
        const truncContent = secText.length > MAX_CHARS_PER_SLIDE 
          ? secText.slice(0, MAX_CHARS_PER_SLIDE) + '……' : secText;
        slides.push({
          section_name: sectionName,
          slide_index: slideIdx,
          layout: 'content',
          title: sec.title,
          summary_text: truncContent,
          coverage: 'high'
        });
      }
    } else {
      // Leaf section or standalone: create content slide(s)
      if (secText.length <= 10) {
        // Too short - skip or create minimal slide
        slideIdx++;
        slides.push({
          section_name: sectionName,
          slide_index: slideIdx,
          layout: 'content',
          title: sec.title,
          summary_text: secText || sec.title,
          coverage: secText.length > 0 ? 'medium' : 'low'
        });
      } else if (secText.length <= MAX_CHARS_PER_SLIDE) {
        slideIdx++;
        slides.push({
          section_name: sectionName,
          slide_index: slideIdx,
          layout: 'content',
          title: sec.title,
          summary_text: secText,
          coverage: 'high'
        });
      } else {
        // Long content: split into multiple slides
        const chunks = splitTextIntoChunks(secText, MAX_CHARS_PER_SLIDE);
        chunks.forEach((chunk, ci) => {
          slideIdx++;
          const suffix = chunks.length > 1 ? `（${ci + 1}/${chunks.length}）` : '';
          slides.push({
            section_name: sectionName,
            slide_index: slideIdx,
            layout: 'content',
            title: sec.title + suffix,
            summary_text: chunk,
            coverage: 'high'
          });
        });
      }
    }
  }

  return { slides };
}

// Helper: split long text into chunks at sentence boundaries
function splitTextIntoChunks(text, maxChars) {
  if (text.length <= maxChars) return [text];
  const chunks = [];
  let remaining = text;
  while (remaining.length > 0) {
    if (remaining.length <= maxChars) {
      chunks.push(remaining);
      break;
    }
    // Find last sentence boundary within maxChars
    let cutAt = maxChars;
    const searchRange = remaining.slice(0, maxChars);
    const lastSentence = Math.max(
      searchRange.lastIndexOf('。'),
      searchRange.lastIndexOf('；'),
      searchRange.lastIndexOf('！'),
      searchRange.lastIndexOf('？'),
      searchRange.lastIndexOf('. '),
    );
    if (lastSentence > maxChars * 0.3) {
      cutAt = lastSentence + 1;
    }
    chunks.push(remaining.slice(0, cutAt));
    remaining = remaining.slice(cutAt).trim();
  }
  return chunks;
}

function renderAudit(data) {
  document.getElementById('auditLoading').style.display = 'none';
  document.getElementById('auditResults').style.display = '';
  document.getElementById('btnStep2Next').disabled = false;

  const slides = data.slides || [];
  let highC = 0, medC = 0, lowC = 0;
  slides.forEach(s => { if (s.coverage === 'high') highC++; else if (s.coverage === 'medium') medC++; else lowC++; });

  document.getElementById('auditTotalSlides').textContent = slides.length;
  document.getElementById('auditHighCount').textContent = highC;
  document.getElementById('auditMedCount').textContent = medC;
  document.getElementById('auditLowCount').textContent = lowC;

  const grid = document.getElementById('auditGrid');
  grid.innerHTML = '';
  slides.forEach((s, i) => {
    const cov = s.coverage || 'medium';
    const covLabel = { high: '✓ 充分', medium: '△ 部分', low: '✗ 不足' }[cov];
    
    // Determine what to show in preview
    let previewContent = '';
    if (s.summary_text) {
      previewContent = `<div style="font-size:12px; color:var(--text-dim); line-height:1.5; margin-bottom:4px;">${s.summary_text}</div>`;
    } else if (s.left_text || s.right_text) {
      previewContent = `
        <div style="display:flex; gap:10px;">
          <div style="flex:1; font-size:11px; color:var(--text-dim);">[左] ${s.left_text || ''}</div>
          <div style="flex:1; font-size:11px; color:var(--text-dim);">[右] ${s.right_text || ''}</div>
        </div>
      `;
    } else if (s.content && s.content.length > 0) {
      previewContent = `<ul class="audit-bullets">${s.content.slice(0, 4).map(b => `<li>${b}</li>`).join('')}</ul>`;
    }

    const warnings = (s.warnings || []);

    const card = document.createElement('div');
    card.className = 'audit-card';
    card.innerHTML = `
      <div class="audit-bar ${cov}"></div>
      <div class="audit-num">${i + 1}</div>
      <div class="audit-body">
        <div class="audit-section">${s.section_name || ''}</div>
        <div class="audit-title">${s.title || ''}</div>
        ${previewContent}
        ${s.source_hint ? `<div class="audit-source">📍 ${s.source_hint}</div>` : ''}
      </div>
      <div class="audit-meta">
        <div class="audit-layout-tag">${s.layout || 'content'}</div>
        <div class="audit-coverage ${cov}">${covLabel}</div>
        ${warnings.map(w => `<div class="audit-warn">⚠ ${w}</div>`).join('')}
      </div>
    `;
    grid.appendChild(card);
  });
}

// ============================================================
// STEP 3: Generate PPTX
// ============================================================
async function generatePPTX() {
  goToStep(3);
  document.getElementById('genProgress').style.display = '';
  document.getElementById('genResult').style.display = 'none';

  try {
    document.getElementById('genDetail').textContent = '加载模板资源...';
    await loadAssets();

    document.getElementById('genDetail').textContent = '渲染幻灯片...';
    const T = TEMPLATE;
    const C = T.colors;
    const S = T.sizing;
    const slides = auditResult.slides || [];
    const institution = document.getElementById('institution').value;
    const presenter = document.getElementById('presenterName').value;

    const pres = new PptxGenJS();
    pres.layout = T.dimensions.layout;
    pres.author = presenter || 'ITEI';
    pres.title = docSummary?.title || '科研汇报';

    // ---- Helpers ----
    // Set background based on slide type
    function setBg(slide, type) {
      if (type === 'cover') {
        if (TITLE_BG_B64) slide.background = { data: `image/jpeg;base64,${TITLE_BG_B64}` };
        else slide.background = { color: C.bg };
      } else {
        if (CONTENT_BG_B64) slide.background = { data: `image/jpeg;base64,${CONTENT_BG_B64}` };
        else slide.background = { color: C.bg };
      }
    }

    // Parse **bold** markers → rich text; also ##red## → brand red bold
    function parseBold(text, baseOpts = {}) {
      if (!text || typeof text !== 'string') return [{ text: String(text || ''), options: { ...baseOpts } }];
      const parts = [];
      // First pass: split by **...**
      const rx = /\*\*(.*?)\*\*/g;
      let last = 0, m;
      while ((m = rx.exec(text)) !== null) {
        if (m.index > last) parts.push({ text: text.slice(last, m.index), options: { ...baseOpts } });
        parts.push({ text: m[1], options: { ...baseOpts, bold: true, color: C.brandRed } });
        last = rx.lastIndex;
      }
      if (last < text.length) parts.push({ text: text.slice(last), options: { ...baseOpts } });
      return parts.length ? parts : [{ text, options: { ...baseOpts } }];
    }

    // Build rich text for paragraphs or bullets
    function buildRichText(input, opts = {}) {
      if (!input) return [];
      const isPara = typeof input === 'string';
      const items = isPara ? [input] : (Array.isArray(input) ? input : []);
      if (items.length === 0) return [];
      const baseOpts = { fontSize: S.bullet, fontFace: T.fonts.body, color: C.bodyText, ...opts };
      const result = [];
      items.forEach((item, i, arr) => {
        const isLastItem = (i === arr.length - 1);
        // Parse bold segments for this item (no bullet/breakLine yet)
        const segments = parseBold(item, { ...baseOpts, paraSpaceAfter: 8 });
        segments.forEach((seg, si) => {
          const isFirstSeg = (si === 0);
          const isLastSeg = (si === segments.length - 1);
          // Only first segment of each item gets bullet
          if (isFirstSeg && !isPara) seg.options.bullet = { code: '25C6' };
          // Only last segment of each item gets breakLine (except for the very last item)
          if (isLastSeg && !isLastItem) seg.options.breakLine = true;
          result.push(seg);
        });
      });
      return result;
    }

    const mkShadow = () => ({ type: 'outer', color: '000000', blur: 4, offset: 2, angle: 135, opacity: 0.06 });

    // Track section numbers for content page title prefix
    let sectionCounter = 0;
    let lastSectionName = '';

    slides.forEach((sd, idx) => {
      const slide = pres.addSlide();
      const layout = sd.layout || 'content';

      // Track section changes for numbering
      if (sd.section_name !== lastSectionName) {
        sectionCounter++;
        lastSectionName = sd.section_name;
      }

      log(`渲染 ${idx + 1}/${slides.length}: [${layout}] ${sd.title || ''}`);

      switch (layout) {
        // =============== COVER (模板1) ===============
        case 'title': {
          setBg(slide, 'cover');
          const titleText = sd.subtitle || docSummary?.title || sd.title || '';
          // Institution + project title (centered, large)
          slide.addText(institution, {
            ...T.cover.title, fontSize: S.coverTitle, fontFace: T.fonts.title,
            color: C.darkText, bold: true, align: 'center', valign: 'middle', margin: 0
          });
          // Subtitle / presentation title
          slide.addText(titleText, {
            ...T.cover.subtitle, fontSize: S.coverSubtitle, fontFace: T.fonts.title,
            color: C.darkText, bold: true, align: 'center', valign: 'middle', margin: 0
          });
          // Institution repeat
          slide.addText(institution, {
            ...T.cover.institution, fontSize: S.coverInst, fontFace: T.fonts.body,
            color: C.bodyText, align: 'center', valign: 'middle', margin: 0
          });
          // Presenter
          if (presenter) {
            slide.addText(`汇报人：${presenter}`, {
              ...T.cover.presenter, fontSize: S.coverInst, fontFace: T.fonts.body,
              color: C.bodyText, align: 'center', valign: 'middle', margin: 0
            });
          }
          break;
        }

        // =============== TOC (模板2-目录) ===============
        case 'toc': {
          setBg(slide, 'content');
          // "目 录" centered title
          slide.addText('目 录', {
            ...T.toc.title, fontSize: S.sectionTitle, fontFace: T.fonts.title,
            color: C.darkText, bold: true, align: 'center', valign: 'middle', margin: 0
          });
          // Section bars
          const tocItems = (sd.content || []);
          tocItems.forEach((item, i) => {
            const y = T.toc.firstBarY + i * T.toc.barGap;
            const isFirst = (i === 0);
            const barColor = isFirst ? C.brandRed : C.deepNavy;
            const numText = String(i + 1).padStart(2, '0');
            // Number tab (slanted parallelogram simulated by rectangle)
            slide.addShape(pres.shapes.RECTANGLE, {
              x: T.toc.barsX - 0.6, y: y, w: 0.7, h: T.toc.barH,
              fill: { color: barColor }, rotate: -8
            });
            slide.addText(numText, {
              x: T.toc.barsX - 0.55, y: y, w: 0.55, h: T.toc.barH,
              fontSize: 14, fontFace: T.fonts.title, color: 'FFFFFF',
              bold: true, align: 'center', valign: 'middle', margin: 0
            });
            // Main bar
            slide.addShape(pres.shapes.RECTANGLE, {
              x: T.toc.barsX, y: y, w: T.toc.barsW, h: T.toc.barH,
              fill: { color: barColor }
            });
            // Bar text
            slide.addText(item, {
              x: T.toc.barsX + 0.3, y: y, w: T.toc.barsW - 0.6, h: T.toc.barH,
              fontSize: 16, fontFace: T.fonts.body, color: 'FFFFFF',
              bold: false, align: 'center', valign: 'middle', margin: 0
            });
          });
          break;
        }

        // =============== SECTION DIVIDER ===============
        case 'section': {
          setBg(slide, 'content');
          // Large centered section title below header
          slide.addText(sd.title || '', {
            x: 2, y: 2.5, w: 9, h: 2,
            fontSize: S.sectionTitle, fontFace: T.fonts.title,
            color: C.primary, bold: true, align: 'center', valign: 'middle', margin: 0
          });
          // Decorative underline
          slide.addShape(pres.shapes.RECTANGLE, {
            x: 5.5, y: 4.7, w: 2.3, h: 0.05, fill: { color: C.secondary }
          });
          break;
        }

        // =============== TWO COLUMN ===============
        case 'two_column':
        case 'comparison': {
          setBg(slide, 'content');
          // Title on banner
          const tcTitle = sd.title || '';
          slide.addText(tcTitle, {
            ...T.twoCol.titleOnBanner, fontSize: S.slideTitle, fontFace: T.fonts.title,
            color: 'FFFFFF', bold: true, align: 'left', valign: 'middle', margin: 0
          });
          // Left card
          slide.addShape(pres.shapes.RECTANGLE, {
            ...T.twoCol.left, fill: { color: C.cardBg }, shadow: mkShadow()
          });
          if (sd.left_title) {
            slide.addText(sd.left_title, {
              x: T.twoCol.left.x + 0.2, y: T.twoCol.left.y + 0.1, w: T.twoCol.left.w - 0.4, h: 0.45,
              fontSize: 16, fontFace: T.fonts.title, color: C.primary, bold: true, margin: 0
            });
          }
          const lBody = sd.left_text || sd.left_content || sd.content || [];
          const lBullets = buildRichText(lBody, { fontSize: 14 });
          if (lBullets.length) {
            const lY = T.twoCol.left.y + (sd.left_title ? 0.65 : 0.15);
            slide.addText(lBullets, { x: T.twoCol.left.x + 0.2, y: lY, w: T.twoCol.left.w - 0.4, h: T.twoCol.left.h - (lY - T.twoCol.left.y) - 0.1, valign: 'top', margin: 0 });
          }
          // Right card
          slide.addShape(pres.shapes.RECTANGLE, {
            ...T.twoCol.right, fill: { color: C.cardBg }, shadow: mkShadow()
          });
          if (sd.right_title) {
            slide.addText(sd.right_title, {
              x: T.twoCol.right.x + 0.2, y: T.twoCol.right.y + 0.1, w: T.twoCol.right.w - 0.4, h: 0.45,
              fontSize: 16, fontFace: T.fonts.title, color: C.primary, bold: true, margin: 0
            });
          }
          const rBody = sd.right_text || sd.right_content || [];
          const rBullets = buildRichText(rBody, { fontSize: 14 });
          if (rBullets.length) {
            const rY = T.twoCol.right.y + (sd.right_title ? 0.65 : 0.15);
            slide.addText(rBullets, { x: T.twoCol.right.x + 0.2, y: rY, w: T.twoCol.right.w - 0.4, h: T.twoCol.right.h - (rY - T.twoCol.right.y) - 0.1, valign: 'top', margin: 0 });
          }
          break;
        }

        // =============== DATA HIGHLIGHT ===============
        case 'data_highlight': {
          setBg(slide, 'content');
          slide.addText(sd.title || '', {
            ...T.content.titleOnBanner, fontSize: S.slideTitle, fontFace: T.fonts.title,
            color: 'FFFFFF', bold: true, align: 'left', valign: 'middle', margin: 0
          });
          // Big number card
          if (sd.highlight_number) {
            slide.addShape(pres.shapes.RECTANGLE, {
              x: S.margin, y: 1.6, w: 4.2, h: 3.0,
              fill: { color: C.deepNavy }, shadow: mkShadow()
            });
            slide.addText(sd.highlight_number, {
              x: S.margin, y: 1.7, w: 4.2, h: 2.0,
              fontSize: 52, fontFace: T.fonts.title, color: 'FFFFFF',
              bold: true, align: 'center', valign: 'middle', margin: 0
            });
            slide.addText(sd.highlight_label || '', {
              x: S.margin, y: 3.7, w: 4.2, h: 0.7,
              fontSize: 14, fontFace: T.fonts.body, color: C.accent2,
              align: 'center', valign: 'top', margin: 0
            });
          }
          const dX = sd.highlight_number ? 5.6 : S.margin;
          const dW = sd.highlight_number ? 6.8 : 11.32;
          const dBody = sd.summary_text || sd.content || [];
          const dBullets = buildRichText(dBody);
          if (dBullets.length) {
            slide.addText(dBullets, { x: dX, y: 1.6, w: dW, h: 5.0, valign: 'top', margin: 0 });
          }
          break;
        }

        // =============== TABLE ===============
        case 'table': {
          setBg(slide, 'content');
          slide.addText(sd.title || '', {
            ...T.content.titleOnBanner, fontSize: S.slideTitle, fontFace: T.fonts.title,
            color: 'FFFFFF', bold: true, align: 'left', valign: 'middle', margin: 0
          });
          if (sd.table?.headers) {
            const tbl = sd.table;
            const hRow = tbl.headers.map(h => ({
              text: h, options: { bold: true, color: 'FFFFFF', fill: { color: C.tableHeader }, fontSize: 13, fontFace: T.fonts.body }
            }));
            const dRows = (tbl.rows || []).map((row, ri) =>
              row.map(cell => ({
                text: String(cell), options: { fontSize: 12, fontFace: T.fonts.body, color: C.bodyText, fill: { color: ri % 2 === 0 ? C.tableStripe : C.bg } }
              }))
            );
            const nCols = tbl.headers.length;
            slide.addTable([hRow, ...dRows], {
              x: S.margin, y: 1.5, w: 11.32, colW: Array(nCols).fill(11.32 / nCols),
              border: { pt: 0.5, color: C.tableBorder }, rowH: 0.44
            });
          }
          // Additional content bullets below table
          const tblExtra = sd.summary_text || sd.content;
          if (tblExtra) {
            const tblRows = sd.table?.rows?.length || 0;
            const bulletsY = Math.min(1.5 + (1 + tblRows) * 0.44 + 0.3, 5.0);
            const bullets = buildRichText(tblExtra, { fontSize: 13 });
            if (bullets.length) {
              slide.addText(bullets, { x: S.margin, y: bulletsY, w: 11.32, h: 6.5 - bulletsY, valign: 'top', margin: 0 });
            }
          }
          break;
        }

        // =============== CONCLUSION / THANKS ===============
        case 'conclusion': {
          setBg(slide, 'content');
          slide.addText(sd.title || '总结', {
            ...T.content.titleOnBanner, fontSize: S.slideTitle, fontFace: T.fonts.title,
            color: 'FFFFFF', bold: true, align: 'left', valign: 'middle', margin: 0
          });
          // Content in a centered, larger font
          const ccBody = sd.summary_text || sd.content || [];
          const ccBullets = buildRichText(ccBody, { fontSize: S.body });
          if (ccBullets.length) {
            slide.addText(ccBullets, {
              x: S.margin + 0.3, y: 1.6, w: 10.7, h: 5.2,
              valign: 'top', margin: 0
            });
          }
          break;
        }

        // =============== CONTENT (default, 模板2-正文) ===============
        default: {
          setBg(slide, 'content');
          // Title positioned on the blue header banner (white text)
          const contentTitle = sd.title || '';
          slide.addText(contentTitle, {
            ...T.content.titleOnBanner, fontSize: S.slideTitle, fontFace: T.fonts.title,
            color: 'FFFFFF', bold: true, align: 'left', valign: 'middle', margin: 0
          });
          // Body content: use summary_text (paragraph) or content (bullet list)
          const cBody = sd.summary_text || sd.content || [];
          const cBullets = buildRichText(cBody);
          if (cBullets.length) {
            slide.addText(cBullets, {
              ...T.content.body, valign: 'top', margin: 0
            });
          }
          break;
        }
      }

      // Page number (skip cover and toc)
      if (idx > 0) {
        slide.addText(`${idx}`, {
          x: 11.8, y: 7.0, w: 1.0, h: 0.35,
          fontSize: S.pageNum, fontFace: T.fonts.body,
          color: 'FFFFFF', align: 'center', margin: 0
        });
      }

      // Speaker notes
      if (sd.notes) slide.addNotes(sd.notes);
    });

    generatedBlob = await pres.write({ outputType: 'blob' });
    const fileName = (docSummary?.title || '科研汇报').replace(/[^\w\u4e00-\u9fff]/g, '_').slice(0, 40) + '.pptx';

    log(`PPTX 生成完成: ${slides.length} 张, ${formatSize(generatedBlob.size)}`, 'success');

    document.getElementById('genProgress').style.display = 'none';
    document.getElementById('genResult').style.display = '';
    document.getElementById('genResultDesc').textContent = `${slides.length} 张幻灯片 · ${formatSize(generatedBlob.size)} · ITEI 标准模板`;

    document.getElementById('btnDownload').onclick = () => {
      const url = URL.createObjectURL(generatedBlob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName; a.click();
      URL.revokeObjectURL(url);
    };

  } catch (err) {
    log(`生成错误: ${err.message}`, 'error');
    document.getElementById('genDetail').textContent = `错误: ${err.message}`;
  }
}

document.getElementById('btnStep3Back').addEventListener('click', () => goToStep(2));

// ============================================================
// Persist settings & init
// ============================================================
['apiKey', 'apiEndpoint', 'presenterName', 'institution'].forEach(id => {
  const el = document.getElementById(id);
  const saved = localStorage.getItem(`pptgen_${id}`);
  if (saved) el.value = saved;
  el.addEventListener('change', () => localStorage.setItem(`pptgen_${id}`, el.value));
});
updateStep0Btn();
// Pre-load assets in background
loadAssets();
</script>
